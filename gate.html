<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSS MATH LAB — เข้าสู่คอร์สเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef6ff; --ink:#1a3a6b; --ink-soft:#4a5f85;
    --blue:#2980b9; --green:#27ae60; --red:#c0392b; --maroon:#922b21; --line:#cfe1f4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:linear-gradient(180deg,#eef6ff,#dcecfb);
    font-family:'Sarabun',sans-serif; color:var(--ink); padding:24px 16px;
  }
  .wrap{ max-width:640px; margin:0 auto; }
  .head{ text-align:center; margin-bottom:22px; }
  .logo{ font-size:36px; }
  h1{ font-family:'Mitr',sans-serif; font-size:19px; color:var(--maroon); margin:6px 0 2px; }
  .sub{ font-size:13px; color:var(--ink-soft); }

  #loadingBox{ text-align:center; padding:40px 0; }
  .spinner{
    width:34px; height:34px; border:4px solid #dcecfb; border-top-color:var(--blue);
    border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #statusText{ font-size:14px; color:var(--ink-soft); }
  #statusText.error{ color:var(--red); font-weight:600; }

  .progress{
    background:#fff; border:1.5px solid var(--line); border-radius:14px;
    padding:14px 18px; margin-bottom:16px; font-family:'Mitr',sans-serif; font-size:13px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .progress b{ color:var(--maroon); }

  .chapter-list{ display:flex; flex-direction:column; gap:10px; }
  .chapter-card{
    display:flex; align-items:center; gap:14px;
    background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:14px 16px;
  }
  .chapter-card.locked{ opacity:.75; }
  .ch-num{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Mitr',sans-serif; font-weight:700; font-size:15px; color:#fff;
  }
  .chapter-card.unlocked .ch-num{ background:linear-gradient(120deg,var(--green),#1e8449); }
  .chapter-card.locked .ch-num{ background:#b9c8de; }
  .ch-info{ flex:1; min-width:0; }
  .ch-title{ font-family:'Mitr',sans-serif; font-weight:600; font-size:14px; color:var(--ink); }
  .ch-status{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .ch-action{
    font-family:'Mitr',sans-serif; font-weight:600; font-size:12.5px; text-decoration:none;
    padding:9px 16px; border-radius:10px; white-space:nowrap; flex-shrink:0;
  }
  .ch-action.enter{ background:linear-gradient(120deg,var(--blue),#1a6a9a); color:#fff; }
  .ch-action.buy{ background:var(--bg); color:var(--blue); border:1.5px solid var(--blue); }

  .hidden{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">🧮</div>
    <h1>หลักคิด</h1>
    <div class="sub">by KSS Math Lab</div>
  </div>

  <div id="loadingBox">
    <div class="spinner"></div>
    <div id="statusText">กำลังตรวจสอบสิทธิ์การเข้าเรียน...</div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="progress">
      <span>ความคืบหน้าของคุณ</span>
      <b id="progressText">0 / 9 บท</b>
    </div>
    <div class="chapter-list" id="chapterList"></div>
  </div>
</div>

<script>
  // แก้เป็น URL ของ Apps Script Web App ที่ deploy ไว้ (ลงท้ายด้วย /exec)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';

  // ตั้งค่าทั้ง 9 บท: contentUrl = หน้าเนื้อหาจริงของบทนั้น, buyUrl = Stripe Payment Link ของบทนั้น
  const CHAPTERS = [
    { id:'ch1', title:'บทที่ 1 — จำนวนและการบวก',      contentUrl:'chapter1.html', buyUrl:'https://buy.stripe.com/ใส่ลิงก์บทที่1' },
    { id:'ch2', title:'บทที่ 2',                          contentUrl:'chapter2.html', buyUrl:'https://buy.stripe.com/ใส่ลิงก์บทที่2' },
    { id:'ch3', title:'บทที่ 3',                          contentUrl:'chapter3.html', buyUrl:'https://buy.stripe.com/ใส่ลิงก์บทที่3' },
    { id:'ch4', title:'บทที่ 4',                          contentUrl:'chapter4.html', buyUrl:'https://buy.stripe.com/ใส่ลิงก์บทที่4' },
    { id:'ch5', title:'บทที่ 5',                          contentUrl:'chapter5.html', buyUrl:'https://buy.stripe.com/ใส่ลิงก์บทที่5' },
    { id:'ch6', title:'บทที่ 6',                          contentUrl:'chapter6.html', buyUrl:'https://buy.stripe.com/ใส่ลิงก์บทที่6' },
    { id:'ch7', title:'บทที่ 7',                          contentUrl:'chapter7.html', buyUrl:'https://buy.stripe.com/ใส่ลิงก์บทที่7' },
    { id:'ch8', title:'บทที่ 8',                          contentUrl:'chapter8.html', buyUrl:'https://buy.stripe.com/ใส่ลิงก์บทที่8' },
    { id:'ch9', title:'บทที่ 9',                          contentUrl:'chapter9.html', buyUrl:'https://buy.stripe.com/ใส่ลิงก์บทที่9' }
  ];

  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const statusEl = document.getElementById('statusText');

  function showError(msg){
    document.querySelector('.spinner').style.display = 'none';
    statusEl.className = 'error';
    statusEl.textContent = msg;
  }

  function renderDashboard(unlockedChapters){
    document.getElementById('loadingBox').classList.add('hidden');
    const dash = document.getElementById('dashboard');
    dash.classList.remove('hidden');

    document.getElementById('progressText').textContent = `${unlockedChapters.length} / ${CHAPTERS.length} บท`;

    const list = document.getElementById('chapterList');
    list.innerHTML = '';
    CHAPTERS.forEach((ch, i) => {
      const unlocked = unlockedChapters.includes(ch.id);
      const card = document.createElement('div');
      card.className = 'chapter-card ' + (unlocked ? 'unlocked' : 'locked');
      card.innerHTML = `
        <div class="ch-num">${unlocked ? '✓' : (i+1)}</div>
        <div class="ch-info">
          <div class="ch-title">${ch.title}</div>
          <div class="ch-status">${unlocked ? 'ปลดล็อกแล้ว พร้อมเรียน' : 'ยังไม่ได้ซื้อบทนี้'}</div>
        </div>
        ${unlocked
          ? `<a class="ch-action enter" href="${ch.contentUrl}?token=${encodeURIComponent(token)}">เข้าเรียน</a>`
          : `<a class="ch-action buy" href="${ch.buyUrl}" target="_blank" rel="noopener">ซื้อบทนี้</a>`}
      `;
      list.appendChild(card);
    });
  }

  if(!token){
    showError('ไม่พบลิงก์เข้าเรียนที่ถูกต้อง กรุณาตรวจสอบอีเมลยืนยันการสั่งซื้อ หรือติดต่อผู้ดูแลระบบ');
  } else {
    fetch(APPS_SCRIPT_URL + '?token=' + encodeURIComponent(token))
      .then(r => r.json())
      .then(data => {
        if(data.valid && data.unlockedChapters && data.unlockedChapters.length > 0){
          localStorage.setItem('kss_course_token', token);
          localStorage.setItem('kss_course_email', data.email || '');
          renderDashboard(data.unlockedChapters);
        } else {
          showError('ลิงก์นี้ไม่ถูกต้องหรือยังไม่พบการซื้อบทใดเลย กรุณาติดต่อผู้ดูแลระบบเพื่อขอความช่วยเหลือ');
        }
      })
      .catch(() => {
        showError('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง');
      });
  }
</script>
</body>
</html>
